<!---Pantalla principal---->
<section class="navbar__general">
    
    <nav class="navbar__content navbar__primary">

        <div class="navbar__hamburger">
            <img src="./assets/images/chiquitoblanco.png" alt="">
            <i id="hamburger" class="hamburguer__icon fa-solid fa-bars" (click)="toggleMenu()"></i>
        </div>

        <div class="navbar__links">
            <div class="container-fluid container__details">
                <div class="d-flex justify-content-end">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown__toggle" type="button" id="idcli" data-bs-toggle="dropdown" aria-expanded="false">
                          {{ getNombreUsuarioSeleccionado() }}
                        </button>
                      </div>
                </div>
            
                <div class="container text-center">
                  <div class="row flex-nowrap">
                      <div class="col details__cli" style="flex-grow: 1;">
                          TASA BCV<br>
                          {{ authService.getTasa() }}
                      </div>
                      <div class="col details__cli" style="flex-grow: 5;">
                          PROVEEDOR<br>
                          {{ authService.getNomprv() }}
                      </div>
                      <div class="col details__cli">
                          <!-- <i class="fas fa-shopping-cart cart-icon" (click)="navigateTo('/carrito')"></i>
                          <span class="fs-4"> {{productosEnCarritoNumber}}</span> -->

                          <mat-icon matBadge="{{productosEnCarritoNumber}}" (click)="navigateTo('/carrito')" style="cursor: pointer;">shopping_cart</mat-icon>
                            <!-- Include text description of the icon's meaning for screen-readers -->
                            <span class="cdk-visually-hidden">
                             {{productosEnCarritoNumber}}
                            </span>
                      </div>
                  </div>
              </div>

            </div>
        </div>
        
    </nav>
</section>
