<div class="portal" id="login__container">

    <div class="loader-overlay" *ngIf="isLoading">
      <div class="d-flex justify-content-center align-items-center h-100">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
    </div>
  
    <div class="portal__login">
      <img src="./assets/images/InsuamincaLogo.png" alt="Logo Insuanet" class="portal__logo" />
      <h1 class="portal__title">¡Bienvenido a Insuanet!</h1>
      <h1 *ngIf="errorMessage" style="color: red; text-align: center;">{{ errorMessage }}</h1>
      <section class="login__container">
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <div class="form-floating">
              <!-- <input
                type="text"
                id="user"
                name="user"
                class="form-control custom-input"
                placeholder="Usuario"
                required
                [(ngModel)]="userData.user"
                #userInput 
              />
              <label for="user">Usuario</label> -->

              <mat-form-field style="width: 100%;" appearance="outline">
                <mat-label>Usuario</mat-label>
                <input matInput #input  placeholder="Usuario" 
                type="text"
                id="user"
                name="user"
                appearance="outline"
                placeholder="Usuario"
                required
                [(ngModel)]="userData.user"
                #userInput 
                />
              </mat-form-field>
            </div>
          </div>
        
          <div class="mb-3">
            <div class="form-floating">
              <!-- <input
                type="password"
                id="pws"
                name="pws"
                class="form-control custom-input"
                placeholder="Contraseña"
                required
                [(ngModel)]="userData.password"
              />
              <label for="pws">Contraseña</label> -->
              <mat-form-field style="width: 100%;" appearance="outline">
                <mat-label>Ingrese su contraseña</mat-label>
                <input matInput [type]="hide() ? 'password' : 'text'" 
                type="password"
                id="pws"
                name="pws"
                placeholder="Contraseña"
                required
                [(ngModel)]="userData.password"
                />
                <button
                  mat-icon-button
                  matSuffix
                  (click)="clickEvent($event)"
                  [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hide()"
                >
                  <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
              </mat-form-field>
            </div>
          </div>
        
          <div class="input_button">
            <button type="submit" class="btn_primary">Ingresar</button>
          </div>
        </form>
      </section>
  
      <a href="#" class="register_link_item"
        >No tienes usuario? <span id="registrate__button" class="registrate__boton">Registrar</span></a
      >
      <a href="#" class="register_link_item"
        >Olvidaste tu contraseña? <span id="olpws__button" class="registrate__boton">Recuperar</span></a
      >
      <p class="portal__footer">Insuaminca, + cerca de ti</p>
    </div>
    
    <div class="portal__image">
      <img src="./assets/images/RECORTEALMA.png" class="login__background" />
      <div class="portal__overlay"></div>
      <img src="./assets/images/modelo1.png" alt="Persona" class="portal__person" />
    </div>
  </div>
