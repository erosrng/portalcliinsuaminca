<app-nav-bar (openMenu)="openMenu($event)"></app-nav-bar>

<div style="display: flex; flex-direction: row;">
  <mat-sidenav-container>
      <mat-sidenav mode="over" [opened]="toggleMenu">
          <app-side-bar></app-side-bar>
      </mat-sidenav>
    </mat-sidenav-container>

  <div class="mi-perfil">
      <header class="mi-perfil__header">
        <h1 class="ofertas-title mi-perfil__title">Cargar pedido por listado (Excel)</h1>
      </header>
    
      <div class="mi-perfil__content">
        <main class="mi-perfil__main">
          <div class="mi-perfil__left">

                          
            <div class="card mt-4 card__info">
                <div class="card-body ">
                    <h3 class="card-title text-primary">Baje su listado e importelo</h3>
                    <!-- <p class="card-text">
                        <span class="cardinfo__text">NOMBRE: <b>NOMBRE EJEMPLO</b></span><br>
                        <span class="cardinfo__text">TELÉFONO: <b>123456789</b></span><br>
                        <span class="cardinfo__text">CORREO: <span class="title__limit">correoorreo.com</span>                                    </span>
                    </p> -->

                    <div class="row mt-5">    
                      
                        <div class="col-12 mb-3">
                            <button class="row-clear-filter" (click)="bajaexcel()">Bajar listado</button>
                        </div>
                        
                        <div class="col-12 upload-container">
                            <label for="excelUpload" class="upload-label">
                    `          <i class="fas fa-file-upload"></i>`
                              <span *ngIf="!fileName">Seleccione archivo .xlsx</span>
                              <span *ngIf="fileName">{{ fileName }}</span>
                              <input type="file" id="excelUpload" class="upload-input" (change)="onFileChange($event)" />
                            </label>
                            <button class="busca__pedido" [disabled]="!habilitarCargar" (click)="cargarArchivo();">Cargar archivo</button>
                        </div>

                    </div>

                </div>
            </div>
  
            <div class="card card__info  mt-5">
                <app-clicard></app-clicard>
            </div>

          </div>

  
        </main>
      </div>
    
  </div>
</div>
<app-footer></app-footer>
